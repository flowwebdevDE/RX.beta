<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Wetter</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="scripts/charts.js"></script>
    <script src="scripts/day.js?v=2"></script>
    <!-- Styles aus der App wiederverwenden (Relativ zu app/ios/wetter/) -->
    <link rel="stylesheet" href="../data/styles/dashboard.css">
    <link rel="stylesheet" href="../data/styles/global-theme.css">
    <style>
        /* Layout Fixes */
        #weather { display: flex; flex-direction: column; gap: 24px; padding-bottom: 40px; }
        
        /* Hauptkarte (Aktuelles Wetter) */
        .weather-main-card { 
            text-align: center; 
            padding: 40px 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            min-height: 320px;
        }
        
        #placeName { 
            font-size: 28px; 
            font-weight: 600; 
            color: var(--text-color); 
            margin: 0 0 5px 0; 
        }
        
        #icon svg { 
            width: 110px; 
            height: 110px; 
            margin: 15px auto; 
            display: block; 
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));
        }
        
        #temp { 
            font-size: 72px; 
            font-weight: 200; 
            margin: 5px 0; 
            letter-spacing: -2px;
            color: var(--text-color);
        }

        #currentSummary {
            font-size: 17px;
            color: var(--secondary-text-color);
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* Details Grid (Wind, Sonnenaufgang etc.) */
        #details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }
        
        #details > div {
            background: var(--background-color);
            padding: 14px;
            border-radius: 16px;
            font-size: 14px;
            color: var(--secondary-text-color);
            text-align: center;
            font-weight: 500;
        }

        /* Suche */
        .searchContainer { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 0; 
            position: relative; 
        }
        #searchBox { 
            flex-grow: 1; 
            background: var(--background-color); 
            color: var(--text-color); 
            border: none; 
            padding: 14px 16px; 
            border-radius: 12px; 
            font-size: 16px;
            outline: none;
            transition: background 0.2s;
        }
        #searchBox:focus { background: var(--border-color); }

        #geoBtn { 
            width: 44px; 
            background: var(--accent-color); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            padding: 10px;
            cursor: pointer; 
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.2s;
        }
        #geoBtn:active { opacity: 0.7; }
        #geoBtn svg { width: 24px; height: 24px; stroke: white; fill: none; stroke-width: 2; }

        #suggestionsList {
            position: absolute;
            top: 100%; left: 0; right: 0;
            background: var(--card-background);
            border-radius: 12px;
            margin-top: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 100;
            overflow: hidden;
        }
        #suggestionsList div {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            color: var(--text-color);
        }
        #suggestionsList div:last-child { border-bottom: none; }
        #suggestionsList div:active { background: var(--background-color); }

        /* Stunden-Vorschau */
        #hourlyForecastGrid { 
            display: flex; 
            gap: 12px; 
            overflow-x: auto; 
            padding: 10px 0; 
            -webkit-overflow-scrolling: touch; 
            scrollbar-width: none; /* Firefox */
        }
        #hourlyForecastGrid::-webkit-scrollbar { display: none; } /* Chrome/Safari */

        .hour { 
            min-width: 70px; 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
        }
        .hour strong { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: var(--secondary-text-color);
        }
        .hour svg { 
            width: 36px; 
            height: 36px; 
            margin: 8px 0; 
            display: block; 
        }
        .hour div:last-child { font-weight: 600; font-size: 15px; }

        /* 7-Tage Liste */
        #forecastGrid { display: flex; flex-direction: column; gap: 0; margin-top: 10px; }
        .day {
            display: grid; 
            grid-template-columns: 60px 40px 1fr auto; 
            align-items: center; 
            gap: 16px;
            padding: 16px 0; 
            border-bottom: 1px solid var(--border-color); 
            font-size: 16px;
            color: var(--text-color);
        }
        .day:last-child { border-bottom: none; }
        .day .icon svg { width: 28px; height: 28px; }
        
        /* Special Params Dashboard Overrides */
        #specialParamsDashboard ul {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 12px !important;
            margin-top: 20px !important;
        }
        #specialParamsDashboard li {
            background: var(--background-color) !important;
            color: var(--text-color) !important;
            border-radius: 16px !important;
            padding: 14px !important;
            font-size: 13px !important;
            display: flex !important;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: none !important;
            flex: auto !important;
        }
        #specialParamsDashboard li strong {
            font-size: 16px;
            margin-top: 4px;
            color: var(--accent-color);
        }
        #specialParamsDashboard li .icon {
            width: 28px; height: 28px; margin-bottom: 6px; color: var(--secondary-text-color);
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="header">
            <a href="../index.html" class="back-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <h1>Wetter</h1>
            <p>Detailansicht & Vorschau</p>
        </header>

        <main class="content">
            <div class="card" style="display: none;">
                <div class="searchContainer">
                    <input id="searchBox" placeholder="Ort suchen..." autocomplete="off">
                    <div id="suggestionsList"></div>
                    <button id="geoBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <div id="weather" style="display:none">
                <div class="card weather-main-card">
                    <h2 id="placeName">—</h2>
                    <p id="icon" style="font-size: 48px; margin: 10px 0;"></p>
                    <h2 id="temp">-</h2>
                    <div id="currentSummary" style="color: var(--secondary-text-color);"></div>
                    <div id="details" style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left;"></div>
                    <div id="specialParamsDashboard"></div>
                </div>

                <div id="dailyOverview" class="card" style="margin-top: 15px;">
                    <h3>Stündliche Vorhersage</h3>
                    <div id="hourlyForecastGrid"></div>
                </div>

                <div style="display: none;" id="hourlyChartContainer" class="card"></div>

                <div class="card" style="margin-top: 15px;">
                    <details>
                        <summary>7-Tage Vorschau anzeigen</summary>
                        <div id="forecastGrid" style="margin-top: 15px;"></div>
                    </details>
                </div>
            </div>
        </main>
    </div>

    <button id="installBtn" style="display:none;margin-top:12px">📱 App installieren</button>
    <script src="scripts/app.js?v=2"></script>
    <script src="../data/scripts/theme-manager.js"></script>

    <div id="offlineNotice" class="card" style="display:none;margin-top:12px;color:#c33;font-weight:600"></div>
</body>

</html>
