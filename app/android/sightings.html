<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Rail Explorer - Sichtungsgruppe</title>
    <link rel="icon" href="data/images/logos/logo.png" type="image/png">
    <link rel="stylesheet" href="data/styles/sightings.css">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body style="overscroll-behavior-y: contain;">

    <!-- Login Overlay für Beta-Test -->
    <div id="login-overlay">
        <div class="login-card">
            <img src="data/images/logos/logo.png" alt="Logo" class="login-logo">
            <h2>Beta Zugang</h2>
            <p>Bitte gib den Zugangscode ein, um die Sichtungsgruppe zu nutzen.</p>
            <input type="text" id="access-code" placeholder="Code eingeben" autocomplete="off">
            <button id="login-btn">Beitreten</button>
            <p id="login-error" style="display:none; color: red; margin-top: 10px; font-size: 14px;">Falscher Code</p>
        </div>
    </div>

    <!-- Custom Popup Overlay -->
    <div id="custom-popup-overlay" class="hidden">
        <div class="popup-card">
            <p id="popup-message"></p>
            <button id="popup-close-btn">OK</button>
        </div>
    </div>

    <!-- Confirm Overlay (Ja/Nein) -->
    <div id="confirm-overlay" class="hidden">
        <div class="popup-card">
            <p id="confirm-message" style="margin-bottom: 20px; font-size: 16px;"></p>
            <div style="display: flex; gap: 10px;">
                <button id="confirm-no-btn" style="flex: 1; background: #e4e6eb; color: black; border: none; padding: 12px; border-radius: 10px; font-weight: 600;">Nein</button>
                <button id="confirm-yes-btn" style="flex: 1; background: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600;">Ja</button>
            </div>
        </div>
    </div>

    <!-- Message Options Overlay (Bottom Sheet) -->
    <div id="message-options-overlay" class="hidden">
        <div class="options-card">
            <div class="msg-preview-header">
                <span id="opt-msg-sender"></span>
                <span id="opt-msg-time"></span>
            </div>
            <div id="opt-msg-text" class="msg-preview-text"></div>
            
            <div class="options-list">
                <button id="opt-btn-reply">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
                    <span>Antworten</span>
                </button>
                <button id="opt-btn-copy">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                    <span>Text kopieren</span>
                </button>
                <button id="opt-btn-forward">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
                    <span>Weiterleiten</span>
                </button>
                <button id="opt-btn-edit" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                    <span>Bearbeiten</span>
                </button>
                <button id="opt-btn-delete" class="hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    <span>Löschen</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Create Group Overlay -->
    <div id="create-group-overlay" class="hidden">
        <div class="popup-card">
            <h3 style="margin-bottom: 15px;">Neue Gruppe</h3>
            <input type="text" id="new-group-name" placeholder="Gruppenname" style="width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px;">
            <div style="display: flex; gap: 10px;">
                <button id="cancel-group-btn" style="flex: 1; background: #e4e6eb; color: black; border: none; padding: 12px; border-radius: 10px; font-weight: 600;">Abbrechen</button>
                <button id="confirm-group-btn" style="flex: 1; background: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600;">Erstellen</button>
            </div>
        </div>
    </div>

    <!-- Forward Overlay -->
    <div id="forward-overlay" class="hidden">
        <div class="popup-card" style="max-width: 400px; height: 70vh; display: flex; flex-direction: column; padding: 0;">
            <div style="padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">Weiterleiten an...</h3>
                <button id="forward-cancel-btn" style="background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
            </div>
            <div id="forward-groups-list" style="flex-grow: 1; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- Forward Confirm Overlay -->
    <div id="forward-confirm-overlay" class="hidden">
        <div class="popup-card">
            <h3 style="margin-bottom: 5px;">Nachricht weiterleiten</h3>
            <p id="forward-target-name" style="color: var(--secondary-text-color); margin-bottom: 15px; font-size: 14px;"></p>
            <div id="forward-preview-content" class="reply-quote" style="margin-bottom: 15px; text-align: left; background: #f0f2f5; border-left: 3px solid var(--accent-color);"></div>
            <input type="text" id="forward-comment-input" placeholder="Kommentar hinzufügen (optional)" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px;">
            <div style="display: flex; gap: 10px;">
                <button id="forward-confirm-cancel" style="flex: 1; background: #e4e6eb; color: black; border: none; padding: 12px; border-radius: 10px; font-weight: 600;">Abbrechen</button>
                <button id="forward-confirm-send" style="flex: 1; background: var(--accent-color); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 600;">Senden</button>
            </div>
        </div>
    </div>

    <div id="main-content">
        
        <!-- Ansicht 1: Gruppenliste -->
        <div id="groups-view">
            <div id="groups-header" class="material-app-bar">
                <a class="back-icon" href="index.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                </a>
                <h1>Sichtungsgruppen</h1>
            </div>
            <div id="groups-search-bar">
                <input type="text" id="group-search-input" placeholder="Gruppen suchen...">
            </div>
            <div id="groups-list">
                <!-- Gruppen werden hier geladen -->
            </div>
            <button id="create-group-btn" class="fab" title="Gruppe erstellen">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
            </button>
        </div>

        <!-- Ansicht 2: Chat (initial versteckt) -->
        <div id="chat-view" class="hidden">
            <div id="chat-header" class="material-app-bar">
                <button id="back-to-groups" class="back-icon" style="background:none; border:none; cursor:pointer;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                </button>
                <div id="chat-avatar" class="group-icon">
                    <!-- Initials go here -->
                </div>
                <div class="header-info">
                    <h1 id="chat-title">Lade...</h1>
                    <p id="status-text">Verbinde...</p>
                </div>
                <button id="refresh-btn" style="background:none; border:none; cursor:pointer; color: var(--accent-color); margin-right: 5px;" title="Aktualisieren">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                </button>
                <button id="chat-search-toggle" style="background:none; border:none; cursor:pointer; color: var(--accent-color); margin-right: 5px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
                <button id="notify-btn" title="Benachrichtigungen aktivieren">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                </button>
            </div>
            <div id="chat-search-bar" class="hidden">
                <input type="text" id="chat-search-input" placeholder="Nachrichten durchsuchen...">
            </div>
            <div id="chat-messages">
                <!-- Sichtungen werden hier geladen -->
            </div>
            <button id="scroll-bottom-btn" class="hidden">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
            </button>
            <div id="user-input-container">
                <div id="reply-preview" class="hidden">
                    <div class="reply-info">
                        <span class="reply-label">Antwort an</span>
                        <span id="reply-preview-sender" class="reply-sender"></span>
                        <span id="reply-preview-timestamp" class="reply-timestamp"></span>
                        <span id="reply-preview-text" class="reply-text-content"></span>
                    </div>
                    <button id="cancel-reply-btn"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
                </div>
                <div class="input-row">
                    <input type="text" id="sighting-input" placeholder="z.B. ICE 511 in Fulda Richtung Süden">
                    <button id="send-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
                </div>
            </div>
        </div>
    </div>

    <script src="data/scripts/sightings.js"></script>
    <script>
        // Haptisches Feedback
        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate(50); // 50ms Vibration
            }
        }
        document.getElementById('send-btn')?.addEventListener('click', vibrate);
    </script>
</body>
</html>
