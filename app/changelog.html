<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rail Explorer</title>
  <link rel="stylesheet" href="data/styles/start.css">
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1>Rail Explorer</h1>
      <p>Infos &amp; Einstellungen</p>
      <a href="https://median.co/share/pwxqrdx" class="btn primary-btn"
        style="position: fixed; right: 20px; top: 30px;">App
        aktualisieren</a>
    </header>

    <!-- Content -->
    <main class="content">

      <!-- Primary Card -->
      <div style="display: none;" class="card primary">
        <div class="card-text">
          <h2>Einstellungen</h2>
          <p style="margin-bottom: 5px; margin-top: 10px;">Bald gibt es hier mehr Einzustellen</p>
          <label class="switch" style="display: none;">
            <input type="checkbox" id="darkmode-toggle">
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Secondary Card -->
      <div class="card">
        <div class="card-text">
          <h2>Version</h2>
          <p>Du nutzt Version 2.5</p>
        </div>
      </div>

      <!-- Secondary Card -->
      <div class="card">
        <div class="card-text">
          <h2>App-Update</h2>
          <p>Tippe oben rechts um die Android-App auf die neueste Version zu aktualisieren.</p>
        </div>
      </div>

      <!-- Secondary Card -->
      <div class="card">
        <div class="card-text">
          <h2>Kontakt</h2>
          <p>Kontaktiere den Entwickler</p>
        </div>
        <a href="mailto:info@flowwebdesign.de" class="btn primary-btn">Mail senden</a>
      </div>

    </main>

  </div>

  <script src="data/scripts/darkmode.js"></script>
</body>

</html>
