<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Rail Explorer</title>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data/images/logos/logo.png" type="images/png">
  <link rel="stylesheet" href="data/styles/main.css">
  <link rel="stylesheet" href="data/styles/dashboard.css">
  <link rel="stylesheet" href="data/iphone/ios.css">
  <script src="data/iphone/ios.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Maplibre GL -->
  <link href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>

  <!-- Maplibre GL Leaflet  -->
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet/leaflet-maplibre-gl.js"></script>

  <meta name="apple-mobile-web-app-capable" content="yes">

</head>

<body style="overflow: hidden;">
  <div id="app" style="height: 100%;">
    <div id="left">
      <header class="header" style="padding-top: max(20px, env(safe-area-inset-top)); background: transparent;">
        <a href="index.html" class="back-icon" style="position: relative; top: 0; left: 0; margin-bottom: 10px;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            <span style="margin-left: 5px; font-weight: 500;">Zurück</span>
        </a>
        <h1>Fahrzeiten</h1>
        <p>Route berechnen</p>
      </header>
      <div class="field">
        <label for="from">Startbahnhof</label>
        <input id="from" type="text" placeholder="Bahnhof suchen" autocomplete="off">
        <div id="from-list" class="autocomplete-list" style="display:none"></div>
      </div>

      <div class="field">
        <label for="to">Zielbahnhof</label>
        <input id="to" type="text" placeholder="Bahnhof suchen" autocomplete="off">
        <div id="to-list" class="autocomplete-list" style="display:none"></div>
      </div>
      <button class="btn" id="calc">Route berechnen</button>
      <button id="clear">Zurücksetzen</button>
      <hr>
      <details>

        <summary>Mehr anzeigen
          <hr>
        </summary>
        <div class="field">
          <label for="via">Wegpunkte (optional)</label>
          <input id="via" type="text" placeholder="Bahnhof suchen" autocomplete="off">
          <div id="via-list" class="autocomplete-list" style="display:none"></div>
          <div id="via-list" class="autocomplete-list"></div>
          <button id="add-via" class="btn-via" type="button">+ Wegpunkt hinzufügen</button>

          <div id="via-tags"></div> <!-- Anzeige der gewählten Zwischenstopps -->

        </div>

        <div class="field">
          <label for="vmax">Zug V<sub>max</sub> (km/h)</label>
          <input id="vmax" type="number" min="10" max="300" value="120">
          <div class="hint">Mindestens 10 km/h, Maximal 300 km/h</div>
        </div>
        <hr>
      </details>
      <div id="results">
        <h3>Ergebnis</h3>
        <div id="summary" class="small">Keine Route berechnet.</div>
        <div id="table-wrap"></div>
      </div>
      <hr style="display: none;">
      <details style="display: none;">
        <summary>Infos anzeigen</summary>
        <div class="small">Hinweis: Diese App verwendet die öffentliche Overpass-API.<br>
          <p>Entwickelt von <a href="https://flowwebdesign.de">FlowWebDesign</a> | <a href="changelog.html">Version
              3.0</a>
          </p>
        </div>
      </details>
    </div>
    <div id="map"></div>
  </div>

  <!-- libs -->
  <script src="data/scripts/functions.js"></script>
  <script src="data/scripts/lock.js"></script>
  <script>
    // Haptisches Feedback für Android
    function vibrate() {
      if ('vibrate' in navigator) {
        navigator.vibrate(50); // 50ms Vibration
      }
    }

    // Alle Buttons mit Vibration ausstatten
    document.querySelectorAll('button').forEach(button => {
      button.addEventListener('click', vibrate);
    });

    // Funktion, um von Android aufgerufen zu werden, um die Karte zu zentrieren oder Marker zu setzen
    function updateMapLocationFromNative(latitude, longitude) {
      console.log(`Native Position für Karte erhalten: ${latitude}, ${longitude}`);
      // Hier würde die Logik stehen, um die Leaflet/Maplibre-Karte zu aktualisieren
      // Beispiel: map.setView([latitude, longitude], 13);
      // Oder einen Marker hinzufügen: L.marker([latitude, longitude]).addTo(map);
      // Diese Implementierung hängt von deiner spezifischen Karteninitialisierung ab.
    }

    // Service Worker registrieren
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./data/sw_main.js')
        .then(registration => console.log('Service Worker (main) erfolgreich registriert:', registration))
        .catch(error => console.error('Service Worker (main) Registrierung fehlgeschlagen:', error));
    }
  </script>


</body>
</html>
